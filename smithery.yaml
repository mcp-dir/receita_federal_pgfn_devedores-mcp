# Smithery configuration for Receita Federal PGFN: Lista de Devedores
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_receita_federal_pgfn_devedores

name: receita_federal_pgfn_devedores-mcp
displayName: "Receita Federal PGFN: Lista de Devedores"
description: >
  Receita Federal PGFN: Lista de Devedores, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/receita_federal_pgfn_devedores-mcp
repository: https://github.com/mcp-dir/receita_federal_pgfn_devedores-mcp

tags:
  - receita_federal_pgfn_devedores
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_receita_federal_pgfn_devedores

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_receita_federal_pgfn_devedores/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
